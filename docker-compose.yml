services:
  # Control plane: keep the API behind the gateway (loopback by default).
  video-service:
    build: .
    ports:
      - "${CONTROL_BIND_ADDRESS:-127.0.0.1}:${CONTROL_PORT:-8080}:8080"
    expose:
      - "8080"
    environment:
      YOLO_MODEL_PATH: ${YOLO_MODEL_PATH:-/models/best.pt}
      YOLO_CONFIDENCE: "${YOLO_CONFIDENCE:-0.25}"
      MAX_FPS: "${MAX_FPS:-20}"
      MEDIAMTX_ENABLED: "${MEDIAMTX_ENABLED:-true}"
      MEDIAMTX_RTSP_URL: "${MEDIAMTX_RTSP_URL:-rtsp://mediamtx:8554}"
      MEDIAMTX_API_URL: "${MEDIAMTX_API_URL:-http://mediamtx:9997}"
      MEDIAMTX_WHEP_URL: "${MEDIAMTX_WHEP_URL:-}"
      MEDIAMTX_LLHLS_URL: "${MEDIAMTX_LLHLS_URL:-}"
      MEDIAMTX_HTTP_SCHEME: "${MEDIAMTX_HTTP_SCHEME:-http}"
    volumes:
      - ./models:/models:ro
    depends_on:
      mediamtx:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - control
      # External RTSP/HTTP sources remain reachable through this non-internal
      # network; host port publication is still controlled above.
      - media

  # Media plane: WHEP/LL-HLS are public playback entry points, while RTSP is
  # intentionally bound to the diagnostic address. The control API remains
  # internal to the compose network and is never published on the host.
  mediamtx:
    image: bluenviron/mediamtx:1.20.1
    command: ["/mediamtx.yml"]
    ports:
      - "${MEDIA_BIND_ADDRESS:-0.0.0.0}:${MEDIA_WHEP_PORT:-8889}:8889"
      - "${MEDIA_BIND_ADDRESS:-0.0.0.0}:${MEDIA_WEBRTC_UDP_PORT:-8189}:8189/udp"
      - "${MEDIA_BIND_ADDRESS:-0.0.0.0}:${MEDIA_LLHLS_PORT:-8888}:8888"
      - "${DIAGNOSTIC_BIND_ADDRESS:-127.0.0.1}:${DIAGNOSTIC_RTSP_PORT:-8554}:8554"
      - "${SRT_BIND_ADDRESS:-127.0.0.1}:${SRT_PORT:-8890}:8890/udp"
    expose:
      - "9997"
    volumes:
      # The default is a non-secret template. Set MEDIAMTX_CONFIG to a local
      # generated file for production; deploy/mediamtx/*.yml is gitignored.
      - "${MEDIAMTX_CONFIG:-./deploy/mediamtx/mediamtx.yml.example}:/mediamtx.yml:ro"
    healthcheck:
      # The standard image is minimal. Probe its own binary without requiring
      # a shell or an HTTP client inside the container.
      test: ["CMD", "/mediamtx", "--version"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped
    networks:
      - control
      - media

networks:
  # No host access is needed for the service-to-MediaMTX control channel.
  control:
    internal: true
  # Media ports are published separately above and can be filtered by the
  # host firewall / reverse proxy independently from CONTROL_PORT.
  media:
