name: ${COMPOSE_PROJECT_NAME:-aiyolo}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  model-converter:
    image: "${MODEL_CONVERTER_IMAGE:-aiyolo-model-converter:local}"
    build:
      context: .
      dockerfile: Dockerfile.converter
    environment:
      CONVERTER_HOST: 0.0.0.0
      CONVERTER_PORT: "8090"
      CONVERTER_TOKEN: "${CONVERTER_TOKEN:?Set CONVERTER_TOKEN in the production env file}"
      CONVERTER_ROOT: /data
      CONVERTER_CALIBRATION_ROOT: /calibration
      CONVERTER_BUILTIN_CALIBRATION_MANIFEST: /app/calibration-builtin/manifest.json
      CONVERTER_MAX_UPLOAD_BYTES: "${CONVERTER_MAX_UPLOAD_BYTES:-536870912}"
      CONVERTER_MAX_QUEUED_JOBS: "${CONVERTER_MAX_QUEUED_JOBS:-20}"
      CONVERTER_TIMEOUT_SECONDS: "${CONVERTER_TIMEOUT_SECONDS:-3600}"
    expose:
      - "8090"
    volumes:
      - converter-data:/data
      - calibration-data:/calibration:ro
    tmpfs:
      - /tmp:size=${CONVERTER_TMPFS_SIZE:-4g},mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "${CONVERTER_CPUS:-2.0}"
    mem_limit: "${CONVERTER_MEMORY_LIMIT:-8g}"
    pids_limit: "${CONVERTER_PIDS_LIMIT:-512}"
    shm_size: "${CONVERTER_SHM_SIZE:-1g}"
    restart: unless-stopped
    stop_grace_period: 45s
    logging: *default-logging
    networks:
      - control
      - media

  video-service:
    image: "${VIDEO_SERVICE_IMAGE:-aiyolo-video-service:local}"
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DEPLOYMENT_ENV: "${DEPLOYMENT_ENV:-production}"
      HOST: 0.0.0.0
      PORT: "8080"
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in the production env file}"
      DATABASE_CONNECT_TIMEOUT_SECONDS: "${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}"
      RUN_DATABASE_MIGRATIONS: "${RUN_DATABASE_MIGRATIONS:-false}"
      AUTH_SESSION_DAYS: "${AUTH_SESSION_DAYS:-30}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:?Set MINIO_ENDPOINT in the production env file}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in the production env file}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in the production env file}"
      MINIO_BUCKET: "${MINIO_BUCKET:-aiyolo-alerts}"
      MINIO_SECURE: "${MINIO_SECURE:-true}"
      MINIO_REGION: "${MINIO_REGION:-}"
      MINIO_ALERT_PREFIX: "${MINIO_ALERT_PREFIX:-alerts}"
      MINIO_AUTO_CREATE_BUCKET: "${MINIO_AUTO_CREATE_BUCKET:-false}"
      YOLO_MODEL_PATH: "${YOLO_MODEL_PATH:-/models/converted/yolo11n_640.onnx}"
      MODEL_SEED_PATH: /models
      REQUIRE_YOLO_MODEL: "${REQUIRE_YOLO_MODEL:-false}"
      YOLO_CONFIDENCE: "${YOLO_CONFIDENCE:-0.25}"
      ADMIN_FRONTEND_MODE: "${ADMIN_FRONTEND_MODE:-vue}"
      YOLO_IMGSZ: "${YOLO_IMGSZ:-640}"
      YOLO_DEVICE: "cpu"
      YOLO_CLASSES: "${YOLO_CLASSES:-}"
      MAX_FPS: "${MAX_FPS:-20}"
      MAX_INPUT_FPS: "${MAX_INPUT_FPS:-30}"
      RTSP_TRANSPORT: "${RTSP_TRANSPORT:-tcp}"
      MODEL_SIGNING_KEY_ID: "${MODEL_SIGNING_KEY_ID:-}"
      MODEL_SIGNING_PRIVATE_KEY_PATH: "${MODEL_SIGNING_PRIVATE_KEY_PATH:-}"
      AIYOLO_REMOTE_CONVERSION_TOKEN: "${CONVERTER_TOKEN:?Set CONVERTER_TOKEN in the production env file}"
      CONVERSION_REMOTE_ENDPOINT: "http://model-converter:8090"
      CONVERSION_REMOTE_TOKEN_ENV: AIYOLO_REMOTE_CONVERSION_TOKEN
      CONVERSION_REMOTE_ALLOW_INSECURE_HTTP: "true"
      CONVERSION_REMOTE_POLL_INTERVAL_SECONDS: "${CONVERSION_REMOTE_POLL_INTERVAL_SECONDS:-2}"
      CONVERSION_VERIFIER_PYTHON: /usr/local/bin/python
      CONVERSION_DEFAULT_CALIBRATION_DATASET_ID: "${CONVERSION_DEFAULT_CALIBRATION_DATASET_ID:-coco8-dev}"
      CONVERSION_INPUT_SIZE: "${CONVERSION_INPUT_SIZE:-640}"
      CONVERSION_TIMEOUT_SECONDS: "${CONVERTER_TIMEOUT_SECONDS:-3600}"
      CONVERSION_AUTO_CONVERT: "${CONVERSION_AUTO_CONVERT:-false}"
      CALIBRATION_ROOT: /app/calibration
      CALIBRATION_MAX_UPLOAD_BYTES: "${CALIBRATION_MAX_UPLOAD_BYTES:-536870912}"
      CALIBRATION_MAX_EXPANDED_BYTES: "${CALIBRATION_MAX_EXPANDED_BYTES:-2147483648}"
      CALIBRATION_MAX_FILES: "${CALIBRATION_MAX_FILES:-5000}"
    ports:
      - "${CONTROL_BIND_ADDRESS:-127.0.0.1}:${CONTROL_PORT:-8080}:8080"
    volumes:
      - model-data:/app/models
      - evidence-data:/app/evidence
      - calibration-data:/app/calibration
      - "${MODEL_MOUNT_PATH:-./models}:/models:ro,Z"
    tmpfs:
      - /tmp:size=1g,mode=1777
    cpus: "${VIDEO_SERVICE_CPUS:-4.0}"
    mem_limit: "${VIDEO_SERVICE_MEMORY_LIMIT:-8g}"
    pids_limit: "${VIDEO_SERVICE_PIDS_LIMIT:-512}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      model-converter:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - control
      - media

volumes:
  model-data:
  evidence-data:
  converter-data:
  calibration-data:

networks:
  control:
    internal: true
  # Keep this existing network name for upgrade compatibility. It provides
  # outbound camera/managed PostgreSQL/MinIO access, not media distribution.
  media:
