apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiyolo-model-converter
  labels:
    app.kubernetes.io/name: aiyolo-model-converter
    app.kubernetes.io/part-of: aiyolo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aiyolo-model-converter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiyolo-model-converter
        app.kubernetes.io/part-of: aiyolo
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: model-converter
          image: aiyolo-model-converter:production
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          env:
            - name: CONVERTER_HOST
              value: 0.0.0.0
            - name: CONVERTER_PORT
              value: "8090"
            - name: CONVERTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aiyolo-runtime-secret
                  key: CONVERTER_TOKEN
            - name: CONVERTER_ROOT
              value: /data
            - name: CONVERTER_CALIBRATION_ROOT
              value: /calibration
            - name: CONVERTER_BUILTIN_CALIBRATION_MANIFEST
              value: /app/calibration-builtin/manifest.json
            - name: CONVERTER_MAX_UPLOAD_BYTES
              value: "536870912"
            - name: CONVERTER_MAX_QUEUED_JOBS
              value: "20"
            - name: CONVERTER_TIMEOUT_SECONDS
              value: "3600"
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 8Gi
          startupProbe:
            exec:
              command: [python, -m, converter_service.healthcheck]
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [python, -m, converter_service.healthcheck]
            periodSeconds: 20
            timeoutSeconds: 8
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: converter-data
              mountPath: /data
            - name: calibration-data
              mountPath: /calibration
              readOnly: true
            - name: temp
              mountPath: /tmp
            - name: shared-memory
              mountPath: /dev/shm
      volumes:
        - name: converter-data
          persistentVolumeClaim:
            claimName: aiyolo-converter-data
        - name: calibration-data
          persistentVolumeClaim:
            claimName: aiyolo-calibration-data
        - name: temp
          emptyDir:
            sizeLimit: 4Gi
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
