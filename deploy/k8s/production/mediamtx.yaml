apiVersion: v1
kind: ConfigMap
metadata:
  name: aiyolo-mediamtx-config
data:
  mediamtx.yml: |
    logLevel: info
    logDestinations: [stdout]
    api: true
    apiAddress: :9997
    apiEncryption: false
    rtsp: true
    rtspAddress: :8554
    rtmp: false
    srt: false
    hls: true
    hlsAddress: :8888
    hlsVariant: lowLatency
    hlsSegmentCount: 7
    hlsSegmentDuration: 1s
    hlsPartDuration: 200ms
    webrtc: true
    webrtcAddress: :8889
    webrtcLocalUDPAddress: :8189
    authMethod: internal
    authInternalUsers:
      - user: any
        pass:
        ips: []
        permissions:
          - action: publish
          - action: read
          - action: playback
          - action: api
    paths:
      all_others: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiyolo-mediamtx
  labels:
    app.kubernetes.io/name: aiyolo-mediamtx
    app.kubernetes.io/part-of: aiyolo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aiyolo-mediamtx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiyolo-mediamtx
        app.kubernetes.io/part-of: aiyolo
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mediamtx
          image: bluenviron/mediamtx:1.20.1
          args: [/mediamtx.yml]
          imagePullPolicy: IfNotPresent
          env:
            - name: MTX_WEBRTCADDITIONALHOSTS
              valueFrom:
                configMapKeyRef:
                  name: aiyolo-runtime-config
                  key: MEDIA_PUBLIC_HOST
            - name: MTX_WEBRTCALLOWORIGINS
              valueFrom:
                configMapKeyRef:
                  name: aiyolo-runtime-config
                  key: MEDIA_ALLOW_ORIGINS
            - name: MTX_HLSALLOWORIGINS
              valueFrom:
                configMapKeyRef:
                  name: aiyolo-runtime-config
                  key: MEDIA_ALLOW_ORIGINS
          ports:
            - {name: rtsp, containerPort: 8554, protocol: TCP}
            - {name: api, containerPort: 9997, protocol: TCP}
            - {name: llhls, containerPort: 8888, protocol: TCP}
            - {name: whep, containerPort: 8889, protocol: TCP}
            - {name: webrtc-udp, containerPort: 8189, protocol: UDP}
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: api
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: api
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
              readOnly: true
            - name: temp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: aiyolo-mediamtx-config
        - name: temp
          emptyDir:
            sizeLimit: 256Mi
