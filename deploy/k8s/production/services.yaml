apiVersion: v1
kind: Service
metadata:
  name: aiyolo-video-service
spec:
  selector:
    app.kubernetes.io/name: aiyolo-video-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: aiyolo-model-converter
spec:
  selector:
    app.kubernetes.io/name: aiyolo-model-converter
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: aiyolo-mediamtx
spec:
  selector:
    app.kubernetes.io/name: aiyolo-mediamtx
  ports:
    - {name: rtsp, port: 8554, targetPort: rtsp, protocol: TCP}
    - {name: api, port: 9997, targetPort: api, protocol: TCP}
    - {name: llhls, port: 8888, targetPort: llhls, protocol: TCP}
    - {name: whep, port: 8889, targetPort: whep, protocol: TCP}
    - {name: webrtc-udp, port: 8189, targetPort: webrtc-udp, protocol: UDP}
---
apiVersion: v1
kind: Service
metadata:
  name: aiyolo-mediamtx-public
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: aiyolo-mediamtx
  ports:
    - {name: llhls, port: 8888, targetPort: llhls, protocol: TCP}
    - {name: whep, port: 8889, targetPort: whep, protocol: TCP}
    - {name: webrtc-udp, port: 8189, targetPort: webrtc-udp, protocol: UDP}
